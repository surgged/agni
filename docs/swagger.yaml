basePath: /
consumes:
- application/json
definitions:
  github_com_surgged_agni_internal_adapters_http_web_api.Error:
    properties:
      details:
        additionalProperties:
          type: string
        type: object
      error:
        example: validation failed
        type: string
    type: object
  internal_adapters_http_web.credentials:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_adapters_http_web.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_adapters_http_web.tokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      refresh_token:
        type: string
    type: object
  internal_adapters_http_web_v1.userDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
host: localhost:8080
info:
  contact: {}
  description: Production-ready backend service scaffolded by crank.
  title: agni API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by email and password and returns a token
        pair.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web.credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_http_web.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the supplied refresh token to prevent further refreshes.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access/refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_http_web.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account and returns an access/refresh token pair.
      parameters:
      - description: Registration payload
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web.credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_adapters_http_web.tokenResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Register a new user
      tags:
      - auth
  /me:
    get:
      description: Returns the authenticated user's id from the JWT subject claim.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /v1/users:
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web_v1.userDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_adapters_http_web_v1.userDTO'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Create a user
      tags:
      - users
  /v1/users/{id}:
    delete:
      description: Deletes a user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Delete a user
      tags:
      - users
    get:
      description: Returns a single user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_http_web_v1.userDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Get a user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates an existing user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_web_v1.userDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_http_web_v1.userDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_surgged_agni_internal_adapters_http_web_api.Error'
      summary: Update a user
      tags:
      - users
produces:
- application/json
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" to authenticate.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
