apiVersion: v1
kind: ConfigMap
metadata:
  name: agni-config
  namespace: agni
data:
  config.yaml: |
    app:
      name: "agni"
      host: "0.0.0.0"
      port: 8080
      env: "production"
    database:
      path: "/app/data/agni.db"
    views:
      enabled: true
      dev_server: ""
    logging:
      level: "info"
      format: "json"
      add_source: false
