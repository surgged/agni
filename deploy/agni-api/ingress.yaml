apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agni-api
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - agni.indralab.xyz
    secretName: agni-api-tls
  rules:
  - host: agni.indralab.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agni-api
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - temporal.agni.indralab.xyz
    secretName: temporal-ui-tls
  rules:
  - host: temporal.agni.indralab.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: temporal-ui
            port:
              number: 8080
