app:
  name: "agni"
  host: "0.0.0.0"
  port: 8080
  env: "production"
  cors_origins:
    - "*"

# DB/Redis are external to this cluster — set via env (DATABASE_DSN, REDIS_ADDR)
# from the agni-secrets secret, so no values are hardcoded here.

logging:
  level: "info"
  format: "json"
  add_source: false

mcp:
  agent_signing_secret: ""
  agent_token_ttl: 720h

email:
  provider: "resend"
  resend_api_key: ""
  from_address: "agni@surgged.xyz"

share:
  domain: "agni.indralab.xyz"
  magic_link_ttl: 24h
  session_ttl: 168h

deploy:
  max_tarball_size_mb: 500
  build_timeout_s: 300
  deploy_timeout_s: 120

k3s:
  namespace: "agni"
  registry_addr: "zoteg.anurag.store"
  kata_runtime_class: "kata-fc"
  ingress_class: "nginx"
  cert_issuer: "letsencrypt-prod"

s3:
  endpoint: "sss.surgged.xyz"
  region: "us-east-1"
  bucket: "agni"
  access_key: ""
  secret_key: ""
  use_ssl: true

registry:
  url: "zoteg.anurag.store"
  username: ""
  password: ""

workflows:
  host_port: "temporal.agni.svc:7233"
  namespace: "default"
  task_queue: "agni-deploy"

views:
  enabled: true
  dev_server: ""
