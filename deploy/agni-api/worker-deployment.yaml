apiVersion: apps/v1
kind: Deployment
metadata:
  name: agni-worker
  labels:
    app: agni-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agni-worker
  template:
    metadata:
      labels:
        app: agni-worker
    spec:
      serviceAccountName: agni-worker
      containers:
      - name: worker
        image: zoteg.anurag.store/agni/agni:latest
        command: ["/app/worker"]
        envFrom:
        - secretRef:
            name: agni-secrets
        volumeMounts:
        - name: config
          mountPath: /app/configs
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: agni-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agni-worker
---
# The worker creates k8s Jobs (image builds), Pods, Services and Ingresses in
# this namespace, plus the zot-pull pull secret. Grant it what it needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agni-worker
rules:
- apiGroups: [""]
  resources: ["pods", "services", "secrets", "configmaps", "namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agni-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agni-worker
subjects:
- kind: ServiceAccount
  name: agni-worker
  namespace: agni
