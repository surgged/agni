apiVersion: v1
kind: Pod
metadata:
  name: app-{id}
  labels:
    app: app-{id}
    agni.owner: "{ownerEmail}"
spec:
  runtimeClassName: kata-fc
  restartPolicy: Always
  containers:
  - name: app
    image: registry.agni.svc:5000/apps/{id}:latest
    ports:
    - containerPort: 8080
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-{id}
spec:
  selector:
    app: app-{id}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-{id}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/auth-url: "http://agni-api.agni.svc:8080/auth/session?app={id}"
    nginx.ingress.kubernetes.io/auth-signin: "https://agni.dev/login?app={id}"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "{id}.agni.dev"
    secretName: app-{id}-tls
  rules:
  - host: "{id}.agni.dev"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-{id}
            port:
              number: 8080
