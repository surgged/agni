apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Agni platform stack + kata/firecracker runtime support.
# - server/worker/temporal/temporal-ui run as deployments (server+worker serve
#   the platform; temporal orchestrates deployments)
# - user app workloads run as kata/firecracker pods
resources:
  - cert-manager/cluster-issuer.yaml
  - kata-runtimeclass.yaml
  - firecracker-runtimeclass.yaml
  - agni-api
