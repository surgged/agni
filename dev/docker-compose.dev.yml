services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agni
      POSTGRES_PASSWORD: agni
      POSTGRES_DB: agni
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agni"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
